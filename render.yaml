services:
  - type: web
    name: api-consulta-clientes-senati
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_API_URL
        value: https://senatiapi.onrender.com
